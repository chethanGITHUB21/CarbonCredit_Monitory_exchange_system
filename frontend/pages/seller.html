    <script>
      const user = JSON.parse(localStorage.getItem("user") || "{}");
      if (!user.id) window.location.href = "/login";
      const token =
        localStorage.getItem("accessToken") || localStorage.getItem("token");
      window.addEventListener("error", (e) => {
        console.error("Page error:", e.error || e.message || e);
      });
      window.addEventListener("unhandledrejection", (e) => {
        console.error("Unhandled rejection:", e.reason || e);
      });

      function calcPreview() {
        const red = parseFloat(document.getElementById("reduction").value) || 0;
        const leak = parseFloat(document.getElementById("leakage").value) || 0;
        const buf = parseFloat(document.getElementById("buffer").value) || 0;
        if (!red) {
          document.getElementById("previewBox").style.display = "none";
          return;
        }
        const net = (red - leak) * (1 - buf / 100);
        document.getElementById("previewBox").style.display = "block";
        document.getElementById("previewCalc").textContent =
          net.toFixed(2) + " tCO₂e/yr net credits";
        document.getElementById("previewFormula").textContent =
          `(${red} − ${leak}) × (1 − ${buf}%) = ${net.toFixed(2)}`;
      }

      async function submitSeller() {
        console.log("submitSeller start");
        if (!token) {
          alert("You are not logged in. Please login again.");
          return;
        }
        const payload = {
          area_m2: parseFloat(document.getElementById("area_m2").value) || 0,
          tree_count:
            parseInt(document.getElementById("tree_count").value) || 0,
          other_absorption_co2e:
            parseFloat(
              document.getElementById("other_absorption_co2e").value,
            ) || 0,
        };
          const absorptionRes = await fetch(
            `/api/projects/${projectId}/absorption`,
            {
              method: "POST",
              headers: {
                Authorization: "Bearer " + token,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            },
          );
          console.log("absorption status:", absorptionRes.status);
          let data = null;
          try {
            data = await absorptionRes.json();

            data = null;

            const msg =

            throw new Error(msg);

            project_name: document.getElementById("proj_name").value,
            project_type: document.getElementById("proj_type").value,
            methodology: document.getElementById("methodology").value,
            baseline_emission:
              parseFloat(document.getElementById("baseline").value) || 0,
            annual_reduction:
              parseFloat(document.getElementById("reduction").value) || 0,
            leakage: parseFloat(document.getElementById("leakage").value) || 0,
            buffer_percent:
              parseFloat(document.getElementById("buffer").value) || 0,
            price_per_credit:
              parseFloat(document.getElementById("price").value) || 0,
            vintage_start:
              parseInt(document.getElementById("vintage").value) || 0,
            vintage_end:
              parseInt(document.getElementById("vintage").value) || 0,
            project_boundary:
              document.getElementById("proj_boundary").value || null,
            verification_doc_url:
              document.getElementById("doc_url").value || null,
          };
          console.log("Submitting /api/credits payload:", creditPayload);
          const creditsRes = await fetch("/api/credits", {
            method: "POST",
